[colors]

  background     	= #2b3339
  background-alt 	= #323d43
  foreground     	= #d3c6aa
  foreground-alt 	= #d3c6aa

  black 		= #4b565c
  red 		  = #e67e80
  green 		= #a7c080
  yellow 		= #dbbc7f
  blue 		  = #7fbbb3
  magenta 	= #d699b6
  cyan 		  = #83c092
  white 		= #d3c6aa

[bar/mybar_external]

  width = 1896
  height = 30
  radius = 5
  fixed-center = true

  monitor = HDMI1

  background = ${colors.background}
  foreground = ${colors.foreground}

  offset-y = 12
  offset-x = 12

  padding-left = 0
  padding-right = 2

  module-margin-left = 0
  module-margin-right = 0

  font-0 = mononoki Nerd Font:pixelsize=11;1
  font-1 = unifont:fontformat=truetype:size=8:antialias=false;0
  font-2 = siji:pixelsize=10;1

  modules-left = bspwm
  modules-center = date
  modules-right = temperature pulseaudio cpu battery wlan

  wm-restack = bspwm

  cursor-click = pointer
  cursor-scroll = ns-resize

[bar/mybar]

  width = 1896
  height = 30
  radius = 5
  fixed-center = true

  monitor = eDP1

  background = ${colors.background}
  foreground = ${colors.foreground}

  offset-y = 12
  offset-x = 12

  padding-left = 0
  padding-right = 2

  module-margin-left = 0
  module-margin-right = 0

  font-0 = mononoki Nerd Font:pixelsize=11;1
  font-1 = unifont:fontformat=truetype:size=8:antialias=false;0
  font-2 = siji:pixelsize=10;1

  modules-left = bspwm
  modules-center = date
  modules-right = pulseaudio cpu memory battery wlan updates

  wm-restack = bspwm

  cursor-click = pointer
  cursor-scroll = ns-resize

[module/bspwm]

  type = internal/bspwm

  pin-workspaces = true

  label-focused = %index%
  label-focused-background = ${colors.background-alt}
  label-focused-underline= ${colors.primary}
  label-focused-padding = 2

  label-occupied = %index%
  label-occupied-padding = 2

  label-urgent = %index%
  label-urgent-foreground = ${colors.red}
  label-urgent-padding = 2

  label-empty = %index%
  label-empty-foreground = ${colors.foreground}
  label-empty-padding = 2

[module/xbacklight]

  type = internal/xbacklight

  label = %percentage%%

  format =  <label>
  format-background = ${colors.background}
  format-foreground = ${colors.magenta}
  format-padding = 1

[module/cpu]

  type = internal/cpu
  interval = 2

  label = %percentage:2%%

  format-prefix = " "
  format-background = ${colors.background}
  format-foreground = ${colors.blue}
  format-padding-left = 1

[module/memory]

  type = internal/memory
  interval = 2
  format-prefix = " | "
  format-prefix-foreground = ${colors.blue}
  format-foreground = ${colors.blue}
  label = %percentage_used%%

  format-padding-right = 1

[module/wlan]

  type = internal/network
  interface = wlan0
  interval = 3.0

  label-connected = %essid%

  format-connected            = 󰖩 <label-connected>
  format-connected-background = ${colors.background}
  format-connected-foreground = ${colors.green}
  format-connected-padding    = 1

  format-disconnected             = 󰖪 Disconected
  format-disconnected-background  = ${colors.backgroung}
  format-disconnected-foreground  = ${colors.green}
  format-disconnected-padding     = 1

[module/eth]

  type = internal/network
  interface = enp57s0
  interval = 3.0

  format-connected-underline = #55aa55
  format-connected-prefix = " "
  format-connected-prefix-foreground = ${colors.foreground-alt}
  label-connected = %local_ip%

  format-disconnected =
  ;format-disconnected = <label-disconnected>
  ;format-disconnected-underline = ${self.format-connected-underline}
  ;label-disconnected = %ifname% disconnected
  ;label-disconnected-foreground = ${colors.foreground-alt}

  format-background = ${colors.background-alt}

[module/date]

  type = internal/date
  interval = 1

  date = " %Y-%m-%d |"
  date-alt = " %Y-%m-%d |"

  time = %H:%M:%S
  time-alt = %H:%M:%S

  label = %date% %time%

  format            = <label>
  format-foreground = ${colors.foreground}
  format-background = ${colors.background}
  format-padding    = 1

[module/pulseaudio]

  type = internal/pulseaudio

  label-volume = %percentage%%
  label-muted  = Muted

  format-volume             = 󰕾 <label-volume>
  format-volume-foreground  = ${colors.magenta}
  format-volume-padding     = 1

  format-muted            = 󰝟 <label-muted>
  format-muted-foreground = ${colors.magenta}
  format-muted-padding    = 1

[module/battery]

  type = internal/battery
  battery = BAT0
  adapter = AC
  full-at = 99

  format-charging             = 󰂄 <label-charging>
  format-charging-foreground  = ${colors.cyan}
  format-charging-padding     = 1

  format-discharging            = 󰁾 <label-discharging>
  format-discharging-foreground = ${colors.cyan}
  format-discharging-padding    = 1

  format-full-prefix      = "󰁹 "
  format-full-foreground  = ${colors.cyan}
  format-full-background  = ${colors.backgroung}
  format-full-padding     = 1

  format-background = ${colors.background}

[module/temperature]

  type = internal/temperature
  thermal-zone = 0
  warn-temperature = 80

  hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon4/temp1_input

  label = %temperature-c%
  label-warn = %temperature-c%
  label-warn-foreground = ${colors.red}

  format            =  <label>
  format-background = ${colors.background}
  format-foreground = ${colors.red}
  format-padding    = 1

  format-warn             =  <label-warn>
  format-warn-background  = ${colors.background-alt}
  format-warn-foreground  = ${colors.red}
  format-warn-padding     = 1

  [module/powermenu]

  type = custom/menu

  expand-right = true

  format-spacing = 1

  label-open = power menu
  label-open-foreground = ${colors.blue}
  label-close = cancel
  label-close-foreground = ${colors.red}
  label-separator = |
  label-separator-foreground = ${colors.foreground-alt}

  menu-0-0 = reboot
  menu-0-0-exec = menu-open-1
  menu-0-1 = power off
  menu-0-1-exec = menu-open-2

  menu-1-0 = cancel
  menu-1-0-exec = menu-open-0
  menu-1-1 = reboot
  menu-1-1-exec = sudo reboot

  menu-2-0 = power off
  menu-2-0-exec = sudo poweroff
  menu-2-1 = cancel
  menu-2-1-exec = menu-open-0

[module/currentcourse]

  type = custom/script
  tail = true

  interval = 2
  exec = awk -F ": " 'NR==1{print $2}' $HOME/university/ccm/disciplina_atual/info.yaml | tr -d "'"

  format-prefix = " "
  format-padding = 1
  format-foreground = ${colors.yellow}

[module/updates]

  type = custom/script
  exec = updates_checker.sh
  interval = 600

  format-prefix = "󰚰 "
  format-padding = 1
  format-foreground = ${colors.yellow}

